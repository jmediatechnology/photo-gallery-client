<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Photo Gallery">
    <defs>
        <clipPath id="photo-window">
            <rect x="18" y="20" width="30" height="21" rx="1.5"/>
        </clipPath>
    </defs>

    <!-- Tile: keeps the mark readable on light and dark backgrounds (browser tabs, navbar) -->
    <rect width="64" height="64" rx="14" fill="#232323"/>

    <g transform="translate(32 32) scale(1.2) translate(-31.5 -32)">
        <!-- Back print -->
        <rect x="12" y="15" width="36" height="32" rx="3" fill="#4a4a4a" transform="rotate(-11 30 31)"/>

        <!-- Front print (instant-photo proportions: wider bottom border) -->
        <g transform="rotate(6 33 34)">
            <rect x="15" y="17" width="36" height="32" rx="3" fill="#f4f1ea"/>
            <g clip-path="url(#photo-window)">
                <rect x="18" y="20" width="30" height="21" fill="#1f3a4d"/>
                <circle cx="40" cy="26.5" r="3.2" fill="#f5a524"/>
                <path d="M18 41 L27 30.5 L33 36.5 L37 32.5 L48 41 Z" fill="#3fa79a"/>
            </g>
        </g>
    </g>
</svg>
